<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente IA · Infraestructura-IT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M18 2 6 18h8l-2 12 12-16h-8z"/></svg>
      <div>
        <h1>Asistente IA</h1>
        <p id="sub" class="muted">Consulta la instalación en lenguaje natural</p>
      </div>
    </div>
    <nav class="menu" aria-label="Módulos"><a href="index.html"><b>1</b>UPS</a><a href="bypass.html"><b>2</b>Bypass</a><a href="gpio.html"><b>3</b>GPIO</a><a href="ia.html" aria-current="page"><b>4</b>IA</a><a href="reportes.html"><b>5</b>Reportes</a><a href="seguridad.html"><b>6</b>Seguridad</a></nav>
    <div class="top-right">
      <span id="link" class="link" data-state="wait"><i></i><span>Conectando</span></span>
      <time id="clock" class="mono muted"></time>
    </div>
  </header>

  <main>
    <section class="panel row" style="justify-content:space-between">
      <span id="ai-status" class="muted">Consultando disponibilidad</span>
      <button class="btn ghost" id="clear" style="margin:0">Nueva conversación</button>
    </section>
    <section class="chat" aria-label="Conversación">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="form">
        <textarea id="q" rows="1" placeholder="Ej.: ¿Hubo cortes de energía esta semana?" aria-label="Pregunta"></textarea>
        <button class="btn primary" id="send">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="muted">Infraestructura-IT. Servicio local en Raspberry Pi 5.</footer>
  <script type="module" src="js/ia.js"></script>
</body>
</html>
