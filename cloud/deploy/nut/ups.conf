# /etc/nut/ups.conf  (ejecuta "sudo nut-scanner -U" para detectar tu UPS USB y ajustar esto)
maxretry = 3

[ups]
  # UPS USB HID estándar: APC Back-UPS/Smart-UPS USB, Eaton, CyberPower, Tripp Lite...
  driver = usbhid-ups
  port = auto
  desc = "UPS principal"
  pollinterval = 2

# Megatec por USB (Vendor 0665:5161, "USB to Serial" de muchas UPS genéricas):
# [ups]
#   driver = nutdrv_qx
#   port = auto
#   vendorid = 0665
#   productid = 5161
#   subdriver = cypress

# Megatec por RS232 usando NUT en lugar del driver nativo:
# [ups]
#   driver = nutdrv_qx
#   port = /dev/ups-serial
